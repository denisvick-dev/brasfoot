name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      BRASFOOT_SEED: "2026"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instala dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tipos (pyright)
        run: pyright .
      - name: Testes (pytest)
        run: |
          echo "semente: ${BRASFOOT_SEED:-2026} (padrão)"
          pytest
      - name: Testes com outras sementes (3.11)
        if: matrix.python-version == '3.11'
        run: |
          for s in 1 2 3 4 5; do
            echo "::group::semente $s"
            BRASFOOT_SEED=$s pytest -q
            echo "::endgroup::"
          done
