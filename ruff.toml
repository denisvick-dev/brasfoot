# Regras de lint do projeto (as mesmas citadas no README):
#
#   ruff check .        # F, E9, B, UP
#
# O arquivo existe para o resultado não depender da versão do Ruff instalada
# (versões novas habilitam mais regras por padrão, o que muda o resultado do
# `ruff check .` de máquina para máquina).

target-version = "py311"
line-length = 88

[lint]
select = ["F", "E9", "B", "UP"]

[lint.isort]
combine-as-imports = true
